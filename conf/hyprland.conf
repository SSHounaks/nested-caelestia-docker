# Nested Hyprland + Caelestia Shell, inside Docker on a GNOME/Wayland host.
# Derived from caelestia-shell-ubuntu/config/26.04/hyprland.conf, with every
# host-session assumption removed (no systemd user manager, no seatd, no
# hyprexpo/swayosd packages, no real DRM output to scale).

debug {
    disable_logs = false
}

splash = false

# Force scale 1. `auto` picks 2.0 on this panel and leaves a cramped desktop;
# see the HiDPI section of the upstream guide.
monitor = ,preferred,auto,1

env = LANG,en_US.UTF-8
env = LC_ALL,en_US.UTF-8
env = QML_IMPORT_PATH,/usr/lib/qt6/qml
# Hyprland is launched by hand, so nothing populated DBUS_SESSION_BUS_ADDRESS.
# This is NOT what makes the `global, caelestia:*` binds work - those speak
# Hyprland's hyprland-global-shortcuts Wayland protocol and need no bus at all.
# It is here so the shell shares the host's session bus, which is where the
# tray items, the MPRIS player and the weather come from.
env = DBUS_SESSION_BUS_ADDRESS,unix:path=/run/user/1000/bus
env = QT_QPA_PLATFORMTHEME
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

# The shell is not supervised by systemd here (the container has no user
# manager), so a crash would leave a bare desktop. This loop is the
# equivalent of the upstream systemd unit.
exec-once = /home/ubuntu/bin/caelestia-shell-supervisor.sh

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(cba6f7ff) rgba(89b4faff) 45deg
    col.inactive_border = rgba(45475aaa)
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 10
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    # Decision D10: off until the double-compositing path is proven.
    blur {
        enabled = false
        size = 6
        passes = 3
        new_optimizations = true
        ignore_opacity = true
    }
}

animations {
    enabled = true
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsOut, 1, 1.49, easeOutQuint, popin 87%
    animation = fade, 1, 3.03, easeOutQuint
    animation = workspaces, 1, 1.94, easeOutQuint, slide
    animation = layers, 1, 3.81, easeOutQuint
}

dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    vfr = true
}

input {
    kb_layout = gb
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
        disable_while_typing = true
        tap-to-click = true
    }
}

gesture = 3, horizontal, workspace

$mod = SUPER
$terminal = foot

bind = $mod, Return, exec, $terminal
bind = $mod, Q, killactive,
bind = $mod, V, togglefloating,
bind = $mod, F, fullscreen, 0
bind = $mod SHIFT, M, exit,

bind = $mod, left,  movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up,    movefocus, u
bind = $mod, down,  movefocus, d

bind = $mod SHIFT, left,  movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up,    movewindow, u
bind = $mod SHIFT, down,  movewindow, d

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3

bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up,   workspace, e-1

bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Caelestia actions, dispatched over Hyprland's hyprland-global-shortcuts
# Wayland protocol. Quickshell's GlobalShortcut binds the appid; there is
# no D-Bus service involved despite what the upstream guide implies.
bind = $mod, Space,   global, caelestia:launcher
bind = $mod, D,       global, caelestia:dashboard
bind = $mod, S,       global, caelestia:sidebar
bind = $mod, U,       global, caelestia:utilities
bind = $mod, N,       global, caelestia:nexus
bind = $mod, Tab,     global, caelestia:showall
bind = $mod SHIFT, N, global, caelestia:clearNotifs
bind = $mod SHIFT, L, global, caelestia:lock

bindl  = , XF86AudioPlay, global, caelestia:mediaToggle
bindl  = , XF86AudioNext, global, caelestia:mediaNext
bindl  = , XF86AudioPrev, global, caelestia:mediaPrev
bindel = , XF86MonBrightnessUp,   global, caelestia:brightnessUp
bindel = , XF86MonBrightnessDown, global, caelestia:brightnessDown

windowrule {
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

windowrule {
    name = float-config-tools
    match:class = ^(pavucontrol|nwg-displays|nwg-look|qt6ct|blueman-manager)$

    float = true
}
